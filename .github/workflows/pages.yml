name: Publicar protótipo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Testar o motor e a partida
        run: node --test motor/testes/*.test.mjs simulacao/testes/*.test.mjs prototipo/testes/*.test.mjs
      - name: Preparar os arquivos do jogo
        run: bash prototipo/empacotar-pages.sh "$RUNNER_TEMP/catch-all-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/catch-all-pages
      - uses: actions/deploy-pages@v4
        id: publicacao
