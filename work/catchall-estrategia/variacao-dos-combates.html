<figure id="catchall-variacao" lang="pt-BR">
  <style>
    #catchall-variacao { display: grid; gap: calc(var(--font-size-base) * .6); margin: 0; }
    #catchall-variacao figcaption { display: grid; gap: calc(var(--font-size-base) * .25); }
    #catchall-variacao .rotulo, #catchall-variacao .eixo { display: flex; justify-content: space-between; gap: calc(var(--font-size-base) * .5); }
    #catchall-variacao .valor { white-space: nowrap; }
    #catchall-variacao .trilho { margin-block-start: calc(var(--font-size-base) * .22); height: calc(var(--font-size-base) * .44); background: var(--muted); }
    #catchall-variacao .barra { display: block; background: var(--viz-series-1, var(--blue)); height: 100%; width: calc(var(--percentual) * 5%); }
    #catchall-variacao .eixo { color: var(--muted-foreground); }
  </style>
  <figcaption>
    <h3>Quando a vitória troca de lado</h3>
    <p class="text-small text-muted">20.532 comparações por cenário · semente 612007</p>
  </figcaption>
  <div>
    <div class="rotulo"><span>Todas as rolagens refeitas</span><span class="valor tabular-nums">15,9%</span></div>
    <div class="trilho" aria-hidden="true"><span class="barra" style="--percentual:15.85"></span></div>
  </div>
  <div>
    <div class="rotulo"><span>Somente rolagens de ataque refeitas</span><span class="valor tabular-nums">14,9%</span></div>
    <div class="trilho" aria-hidden="true"><span class="barra" style="--percentual:14.90"></span></div>
  </div>
  <div>
    <div class="rotulo"><span>Somente as demais rolagens refeitas</span><span class="valor tabular-nums">2,9%</span></div>
    <div class="trilho" aria-hidden="true"><span class="barra" style="--percentual:2.92"></span></div>
  </div>
  <div>
    <div class="rotulo"><span>Novo sorteio de cartas pela mesma heurística</span><span class="valor tabular-nums">17,4%</span></div>
    <div class="trilho" aria-hidden="true"><span class="barra" style="--percentual:17.43"></span></div>
  </div>
  <div>
    <div class="rotulo"><span>Todas as rolagens refeitas, com ataque de 2 a 5</span><span class="valor tabular-nums">11,1%</span></div>
    <div class="trilho" aria-hidden="true"><span class="barra" style="--percentual:11.10"></span></div>
  </div>
  <div class="eixo text-small" aria-hidden="true"><span>0%</span><span>5%</span><span>10%</span><span>15%</span><span>20%</span></div>
</figure>
